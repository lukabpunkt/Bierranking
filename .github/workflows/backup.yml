name: Datenbank-Backup

on:
  schedule:
    - cron: "0 3 * * 1" # jeden Montag 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_SECRETS: ${{ secrets.SUPABASE_DB_URL != '' && secrets.BACKUP_PASSPHRASE != '' }}
    steps:
      - name: PostgreSQL-Client installieren
        if: ${{ env.HAS_SECRETS == 'true' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump erstellen
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::Secrets SUPABASE_DB_URL und/oder BACKUP_PASSPHRASE fehlen – Backup übersprungen (siehe README)."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          STAMP=$(date -u +%Y-%m-%d_%H%M)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # Schema public + auth (Nutzerkonten), ohne Rollen/Eigentümer – lässt sich in ein neues Projekt einspielen
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --schema=public --schema=auth \
            --no-owner --no-privileges --quote-all-identifiers \
            --file="prost-zeugnis-$STAMP.sql"
          gzip -9 "prost-zeugnis-$STAMP.sql"
          # Verschlüsseln (AES-256): Das Repo ist öffentlich, Artifacts sind für GitHub-Nutzer abrufbar.
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "prost-zeugnis-$STAMP.sql.gz.gpg" "prost-zeugnis-$STAMP.sql.gz"
          rm "prost-zeugnis-$STAMP.sql.gz"
          ls -lh "prost-zeugnis-$STAMP.sql.gz.gpg"

      - name: Als Artifact speichern (90 Tage)
        if: env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: prost-zeugnis-backup-${{ env.STAMP }}
          path: prost-zeugnis-*.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error
